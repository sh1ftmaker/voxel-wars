name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/build.mjs --minify
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html dist assets _site/
          mkdir -p _site/vendor/box3d && cp vendor/box3d/*.wasm _site/vendor/box3d/
          rm -f _site/dist/*.map
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
