name: Deploy to GitHub Pages
on:
  push:
    branches: [main, materials, sph, mpm]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # one site: main at the root, each experimental branch that exists under /<branch>/
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main and the experimental branches
        run: |
          build() { (cd "$1" && for i in 1 2 3; do npm ci && break; sleep 15; done && node tools/build.mjs --minify); }
          assemble() {
            mkdir -p "$2"
            cp -r "$1"/index.html "$1"/dist "$1"/assets "$2"/
            mkdir -p "$2"/vendor/box3d && cp "$1"/vendor/box3d/*.wasm "$2"/vendor/box3d/
            rm -f "$2"/dist/*.map
          }
          build main && assemble main _site
          for b in materials sph mpm; do
            git clone --depth 1 -b "$b" "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$b" || continue
            build "$b" && assemble "$b" _site/"$b"
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
